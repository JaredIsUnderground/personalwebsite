<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jared’s personal portfolio. Explore his résumé, contact information, LinkedIn profile, and future blog posts.">
  <meta name="theme-color" content="#1B1B1B">
  <title>Jared Langford — Personal Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--paper:#1B1B1B;--ink:#EEEEEE;--muted:#DDDDDD;--accent:#E66B16;--link:#00BFFF;--border:#777777}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    .page{min-height:100svh;max-width:1440px;margin:auto;padding:0 64px;display:flex;flex-direction:column}
    main{flex:1;display:grid;place-items:center;padding:60px 0}
    .intro{text-align:center;width:100%;max-width:650px}
    .portrait-frame{width:min(300px,100%);aspect-ratio:1;margin:0 auto 35px;position:relative}
    .portrait{display:block;width:100%;height:100%;object-fit:cover;object-position:center 68%;border:1px solid var(--border)}
    h1{color:var(--accent);font-family:Georgia,'Times New Roman',serif;font-size:clamp(46px,6vw,68px);font-weight:400;line-height:1.08;letter-spacing:-3px;margin:0 0 23px}
    .bio{font-size:16px;line-height:1.85;color:var(--muted);max-width:530px;margin:0 auto;text-wrap:pretty}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:31px}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:13px;padding:0 23px;min-height:51px;border-radius:5px;text-decoration:none;font-size:13px;font-weight:500;border:1px solid var(--ink);transition:background .18s,transform .18s,color .18s}
    .button-secondary{color:var(--link);background:transparent;border-color:var(--link)}
    .button:hover{transform:translateY(-2px)}
    .button-secondary:hover{background:var(--link);color:var(--paper);border-color:var(--link)}
    .button:focus-visible{outline:3px solid var(--link);outline-offset:5px}
    .button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:600px){.page{padding:0 24px}main{padding:45px 0 50px}.portrait-frame{width:min(260px,100%);margin-bottom:30px}h1{letter-spacing:-2px}.bio{font-size:15px;line-height:1.8}.actions{gap:10px}.button{padding:0 17px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){.button{transition:none}}
  </style>
</head>
<body>
  <div class="page">
    <main>
      <section class="intro" aria-labelledby="name">
        <div class="portrait-frame"><img class="portrait" src="portrait.jpg" alt="Jared with his dog beside a forest waterfall" width="1536" height="2048" fetchpriority="high"></div>
        <h1 id="name">Jared Langford</h1>
        <p class="bio">My name is Jared, and I’m an Applied Mathematics and Information Science student at the University of Kentucky. Here you’ll find my résumé, contact information, LinkedIn profile, and future blog posts.</p>
        <div class="actions">
          <a class="button button-secondary" href="Jared-Langford-Resume.pdf" download="Jared-Langford-Resume.pdf">Download résumé <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg></a>
          <a class="button button-secondary" href="mailto:jarl1701@protonmail.com">Contact me <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg></a>
          <a class="button button-secondary" href="https://www.linkedin.com/in/jaredclangford" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in a new tab)">LinkedIn <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
